<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>感情分析ウィジェット - EmotionLens</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- ヘッダー -->
    <header class="header">
      <div class="header-left">
        <div class="logo-icon">
          <svg viewBox="0 0 40 40" fill="none">
            <circle cx="20" cy="20" r="19" stroke="url(#grad)" stroke-width="2"/>
            <circle cx="14" cy="16" r="3" fill="url(#grad)"/>
            <circle cx="26" cy="16" r="3" fill="url(#grad)"/>
            <path d="M10 26 Q20 34 30 26" stroke="url(#grad)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
            <defs>
              <linearGradient id="grad" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#a855f7"/>
                <stop offset="100%" stop-color="#3b82f6"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <div>
          <h1 class="logo-text">EmotionLens</h1>
          <p class="logo-sub">AI表情感情分析</p>
        </div>
      </div>
      <div class="header-right">
        <div class="status-badge" id="status-badge">
          <span class="status-dot"></span>
          <span id="status-text">待機中</span>
        </div>
      </div>
    </header>

    <!-- メインコンテンツ -->
    <div class="main-layout">
      <!-- 左: 入力パネル -->
      <div class="input-panel">
        <!-- モード選択 -->
        <div class="mode-selector">
          <button class="mode-btn active" id="btn-camera" onclick="setMode('camera')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M23 7l-7 5 7 5V7z"/>
              <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
            </svg>
            カメラ
          </button>
          <button class="mode-btn" id="btn-upload" onclick="setMode('upload')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/>
              <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
            動画アップロード
          </button>
        </div>

        <!-- カメラモード -->
        <div class="input-section" id="camera-section">
          <div class="video-wrapper">
            <video id="camera-video" autoplay muted playsinline></video>
            <canvas id="camera-canvas" style="display:none"></canvas>
            <div class="video-overlay" id="camera-overlay">
              <div class="overlay-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                  <path d="M23 7l-7 5 7 5V7z"/>
                  <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
                </svg>
              </div>
              <p>カメラを起動してください</p>
            </div>
          </div>
          <div class="camera-controls">
            <button class="btn btn-primary" id="start-camera-btn" onclick="startCamera()">
              カメラを起動
            </button>
            <button class="btn btn-danger" id="stop-camera-btn" onclick="stopCamera()" style="display:none">
              停止
            </button>
          </div>
          <div class="interval-control">
            <label>解析間隔:
              <select id="interval-select" onchange="updateInterval()">
                <option value="1000">1秒</option>
                <option value="2000" selected>2秒</option>
                <option value="3000">3秒</option>
                <option value="5000">5秒</option>
              </select>
            </label>
          </div>
        </div>

        <!-- 動画アップロードモード -->
        <div class="input-section" id="upload-section" style="display:none">
          <div class="upload-area" id="upload-area" onclick="document.getElementById('video-input').click()">
            <div class="upload-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="17 8 12 3 7 8"/>
                <line x1="12" y1="3" x2="12" y2="15"/>
              </svg>
            </div>
            <p>動画ファイルをクリックして選択</p>
            <p class="upload-hint">MP4, MOV, WebM 対応</p>
            <input type="file" id="video-input" accept="video/*" style="display:none" onchange="handleVideoUpload(event)">
          </div>
          <div class="video-wrapper" id="upload-video-wrapper" style="display:none">
            <video id="upload-video" controls></video>
            <canvas id="upload-canvas" style="display:none"></canvas>
          </div>
          <div class="upload-controls" id="upload-controls" style="display:none">
            <button class="btn btn-primary" id="analyze-video-btn" onclick="analyzeVideo()">
              動画を解析
            </button>
            <button class="btn btn-secondary" onclick="resetUpload()">
              別の動画を選択
            </button>
          </div>
          <div class="progress-bar-wrapper" id="video-progress-wrapper" style="display:none">
            <div class="progress-label">
              <span>解析中...</span>
              <span id="progress-text">0%</span>
            </div>
            <div class="progress-bar">
              <div class="progress-fill" id="progress-fill"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- 右: 結果パネル -->
      <div class="result-panel">
        <!-- 主要感情表示 -->
        <div class="dominant-emotion-card" id="dominant-card">
          <div class="dominant-emoji" id="dominant-emoji">😐</div>
          <div class="dominant-info">
            <div class="dominant-label">検出された感情</div>
            <div class="dominant-name" id="dominant-name">待機中</div>
            <div class="dominant-confidence" id="dominant-confidence">--</div>
          </div>
        </div>

        <!-- 感情バー -->
        <div class="emotion-bars-card">
          <h3 class="card-title">感情スコア</h3>
          <div class="emotion-bars" id="emotion-bars">
            <div class="emotion-bar-item">
              <span class="emotion-label"><span class="emotion-emoji">😊</span> 喜び</span>
              <div class="bar-track"><div class="bar-fill happy" id="bar-happy" style="width:0%"></div></div>
              <span class="bar-value" id="val-happy">0%</span>
            </div>
            <div class="emotion-bar-item">
              <span class="emotion-label"><span class="emotion-emoji">😢</span> 悲しみ</span>
              <div class="bar-track"><div class="bar-fill sad" id="bar-sad" style="width:0%"></div></div>
              <span class="bar-value" id="val-sad">0%</span>
            </div>
            <div class="emotion-bar-item">
              <span class="emotion-label"><span class="emotion-emoji">😠</span> 怒り</span>
              <div class="bar-track"><div class="bar-fill angry" id="bar-angry" style="width:0%"></div></div>
              <span class="bar-value" id="val-angry">0%</span>
            </div>
            <div class="emotion-bar-item">
              <span class="emotion-label"><span class="emotion-emoji">😲</span> 驚き</span>
              <div class="bar-track"><div class="bar-fill surprised" id="bar-surprised" style="width:0%"></div></div>
              <span class="bar-value" id="val-surprised">0%</span>
            </div>
            <div class="emotion-bar-item">
              <span class="emotion-label"><span class="emotion-emoji">😨</span> 恐怖</span>
              <div class="bar-track"><div class="bar-fill fearful" id="bar-fearful" style="width:0%"></div></div>
              <span class="bar-value" id="val-fearful">0%</span>
            </div>
            <div class="emotion-bar-item">
              <span class="emotion-label"><span class="emotion-emoji">🤢</span> 嫌悪</span>
              <div class="bar-track"><div class="bar-fill disgusted" id="bar-disgusted" style="width:0%"></div></div>
              <span class="bar-value" id="val-disgusted">0%</span>
            </div>
            <div class="emotion-bar-item">
              <span class="emotion-label"><span class="emotion-emoji">😐</span> 中立</span>
              <div class="bar-track"><div class="bar-fill neutral" id="bar-neutral" style="width:0%"></div></div>
              <span class="bar-value" id="val-neutral">0%</span>
            </div>
          </div>
        </div>

        <!-- 説明テキスト -->
        <div class="description-card" id="description-card">
          <h3 class="card-title">AI分析コメント</h3>
          <p class="description-text" id="description-text">解析を開始するとここに表情の説明が表示されます。</p>
          <div class="analysis-meta" id="analysis-meta" style="display:none">
            <span class="meta-item" id="meta-time"></span>
            <span class="meta-item" id="meta-count"></span>
          </div>
        </div>

        <!-- 時系列グラフ -->
        <div class="history-card">
          <h3 class="card-title">感情推移グラフ</h3>
          <canvas id="history-chart" height="120"></canvas>
          <div class="chart-legend" id="chart-legend"></div>
        </div>
      </div>
    </div>

    <!-- フッター -->
    <footer class="footer">
      <span>Powered by Claude claude-opus-4-6 (Anthropic)</span>
      <span id="analysis-count">解析回数: 0</span>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
